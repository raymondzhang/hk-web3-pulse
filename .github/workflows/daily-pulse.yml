name: Daily Pulse Check

on:
  # schedule:
  #   # 每天 9:00 AM HKT = 1:00 AM UTC
  #   # 已于 2026-10-07 停用：定时任务实际未更新数据（JSON 卡在 2026-08-12），
  #   # 且担心静默覆盖人工校订内容。如需恢复，取消下方两行注释即可。
  #   - cron: '0 1 * * *'
  workflow_dispatch:  # 仅保留手动触发

jobs:
  pulse-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Pulse Check
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/pulse-check.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "hk-web3-pulse-bot"
          git config user.email "bot@raymondtalks.xyz"
          git add src/data/
          if git diff --staged --quiet; then
            echo "No changes detected — skipping commit."
          else
            git commit -m "🤖 Daily pulse update [$(TZ='Asia/Hong_Kong' date +%Y-%m-%d)]"
            git push
          fi