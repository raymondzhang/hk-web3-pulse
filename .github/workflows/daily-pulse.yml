"name: Daily Pulse Check\n\non:\n  schedule:\n    # \u6bcf\u5929 9:00 AM HKT = 1:00 AM UTC\n    - cron: '0 1 * * *'\n  workflow_dispatch:  # \u5141\u8bb8\u624b\u52a8\u89e6\u53d1\n\njobs:\n  pulse-check:\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n\n    steps:\n      - name: Checkout repo\n        uses: actions/checkout@v4\n\n      - name: Setup Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Run Pulse Check\n        env:\n          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}\n        run: node scripts/pulse-check.mjs\n\n      - name: Commit and push if changed\n        run: |\n          git config user.name \"hk-web3-pulse-bot\"\n          git config user.email \"bot@raymondtalks.xyz\"\n          git add src/data/\n          if git diff --staged --quiet; then\n            echo \"No changes detected \u2014 skipping commit.\"\n          else\n            git commit -m \"\ud83e\udd16 Daily pulse update [$(TZ='Asia/Hong_Kong' date +%Y-%m-%d)]\"\n            git push\n          fi"